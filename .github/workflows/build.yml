name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Capacitor project
        run: |
          mkdir -p www
          cp index.html www/index.html
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.rbxgamecr.app",
            "appName": "rbxgamecr",
            "webDir": "www",
            "plugins": { "CapacitorHttp": { "enabled": true } }
          }
          JSON
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk rbxgamecrV1.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rbxgamecrV1
          path: rbxgamecrV1.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: V1
          name: rbxgamecrV1
          files: rbxgamecrV1.apk
