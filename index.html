<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rbxgamecr</title>
<style>
  :root{--bg:#0f1115;--card:#181b22;--tx:#e8eaf0;--mu:#8b92a5;--ac:#4f8cff;--ok:#2ecc71;--er:#ff5c5c}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);height:100dvh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid #262a34}
  header h1{font-size:18px;margin:0}
  button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:15px;cursor:pointer}
  button.sec{background:#2a2f3b}
  #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .m{max-width:88%;padding:10px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word;line-height:1.4}
  .u{align-self:flex-end;background:var(--ac)}
  .a{align-self:flex-start;background:var(--card)}
  .s{align-self:center;color:var(--mu);font-size:13px}
  .s.ok{color:var(--ok)} .s.er{color:var(--er)}
  pre{background:#0b0d11;padding:8px;border-radius:8px;overflow-x:auto;font-size:12px;direction:ltr;text-align:left}
  #bar{display:flex;gap:8px;padding:10px;background:var(--card);border-top:1px solid #262a34}
  #inp{flex:1;background:#0f1115;color:var(--tx);border:1px solid #2a2f3b;border-radius:8px;padding:10px;font-size:16px}
  dialog{background:var(--card);color:var(--tx);border:1px solid #2a2f3b;border-radius:14px;width:min(94vw,440px);max-height:92dvh;overflow:auto;padding:18px}
  dialog::backdrop{background:#000a}
  label{display:block;margin:10px 0 4px;font-size:13px;color:var(--mu)}
  dialog input,dialog select{width:100%;background:#0f1115;color:var(--tx);border:1px solid #2a2f3b;border-radius:8px;padding:10px;font-size:15px}
  .row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
  .note{font-size:12px;color:var(--mu);margin-top:10px}
  #prev{display:none;gap:10px;padding:10px 12px 4px;background:var(--card);overflow-x:auto}
  .th{position:relative;flex:none}
  .th img{height:56px;border-radius:8px;display:block}
  .th button{position:absolute;top:-6px;right:-6px;padding:0;width:20px;height:20px;border-radius:50%;font-size:11px;background:#ff5c5c}
  #attach{padding:10px 12px}
</style>
</head>
<body>
<header>
  <h1>🎮 rbxgamecr</h1>
  <button class="sec" id="openS" data-i="settings">⚙ Ayarlar</button>
</header>

<div id="chat"><div class="m s" id="hint" data-i="hint">Ayarlardan AI və Roblox API-ni yaz, sonra oyunda nə istədiyini yaz.</div></div>

<div id="prev"></div>
<div id="bar">
  <button class="sec" id="attach">📎</button>
  <input id="inp" data-ph="ph" placeholder="Məs: mapa 10 ədəd qırmızı blok əlavə et" autocomplete="off">
  <button id="send" data-i="send">Göndər</button>
</div>

<dialog id="dlg">
  <h3 style="margin:0 0 6px" data-i="sTitle">Ayarlar</h3>

  <label data-i="lblLang">Dil</label>
  <select id="lang"></select>

  <label data-i="lblAI">AI seçimi</label>
  <select id="provider">
    <option value="claude">Claude</option>
    <option value="gemini">Gemini</option>
    <option value="grok">Grok</option>
    <option value="rbxcrai">RBXCoder [beta] (API-siz)</option>
  </select>

  <label data-i="lblAIKey">AI API açarı</label>
  <input id="aiKey" type="password">

  <label data-i="lblModel">Model</label>
  <input id="model" list="models" placeholder="gemini-2.5-flash">
  <datalist id="models"></datalist>
  <button class="sec" id="loadM" style="margin-top:6px;width:100%" data-i="loadM">Modelləri yüklə</button>

  <label data-i="lblRbx">Roblox game API açarı (Open Cloud)</label>
  <input id="rbxKey" type="password">

  <label>Universe ID</label>
  <input id="uid" inputmode="numeric">

  <label>Place ID</label>
  <input id="pid" inputmode="numeric">

  <label data-i="lblSave">Kod işlədikdən sonra oyunu yadda saxla (SavePlaceAsync)</label>
  <select id="autoSave"><option value="on">ON</option><option value="off">OFF</option></select>

  <label data-i="lblProxy">Roblox proxy URL (istəyə bağlı)</label>
  <input id="proxy" placeholder="https://xxx.workers.dev/?u=">

  <label data-i="lblAProxy">AI proxy URL (istəyə bağlı)</label>
  <input id="aiProxy" placeholder="https://xxx.workers.dev/?u=">

  <div class="note" data-i="note">Açarlar yalnız bu cihazın yaddaşında saxlanılır.</div>
  <div class="row">
    <button class="sec" id="closeS" data-i="close">Bağla</button>
    <button id="saveS" data-i="save">Yadda saxla</button>
  </div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const FIELDS = ["autoSave","lang","provider","aiKey","model","rbxKey","uid","pid","proxy","aiProxy"];
const DEFAULT_MODEL = {claude:"claude-haiku-5-5", gemini:"gemini-2.5-flash", grok:"grok-4", rbxcrai:"https://huggingface.co/Qwen/Qwen2.5-Coder-0.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf"};
const LANGS = {az:"Azərbaycanca",tr:"Türkçe",en:"English",ru:"Русский",de:"Deutsch",fr:"Français",es:"Español",it:"Italiano",pt:"Português",nl:"Nederlands",pl:"Polski",uk:"Українська",ar:"العربية",fa:"فارسی",hi:"हिन्दी",bn:"বাংলা",ur:"اردو",zh:"中文",ja:"日本語",ko:"한국어",id:"Bahasa Indonesia",ms:"Bahasa Melayu",th:"ไทย",vi:"Tiếng Việt",he:"עברית",el:"Ελληνικά",cs:"Čeština",sv:"Svenska",da:"Dansk",fi:"Suomi",no:"Norsk",ro:"Română",hu:"Magyar",bg:"Български",ka:"ქართული"};
const RTL = ["ar","fa","ur","he"];
const UI = {
  settings:"⚙ Ayarlar", send:"Göndər", ph:"Məs: mapa 10 ədəd qırmızı blok əlavə et",
  hint:"Ayarlardan AI və Roblox API-ni yaz, sonra oyunda nə istədiyini yaz.",
  sTitle:"Ayarlar", lblLang:"Dil", lblAI:"AI seçimi", lblAIKey:"AI API açarı", lblModel:"Model",
  loadM:"Modelləri yüklə", lblRbx:"Roblox game API açarı (Open Cloud)",
  lblSave:"Kod işlədikdən sonra oyunu yadda saxla (SavePlaceAsync)",
  lblProxy:"Roblox proxy URL (istəyə bağlı)", lblAProxy:"AI proxy URL (istəyə bağlı)",
  note:"Açarlar yalnız bu cihazın yaddaşında saxlanılır.", close:"Bağla", save:"Yadda saxla",
  saved:"Ayarlar yadda saxlandı.", connecting:"API qoşulur...", adding:"Roblox oyununa əlavə olunur...",
  done:"Oyuna əlavə olundu.", ask:"Kodu oyuna gətirim?", bring:"Kodu gətir", skip:"Kodu gətirmə", cancelled:"Kod oyuna gətirilmədi.", execTimeout:"5 dəqiqə ərzində kod oyuna gətirilmədi.", timeoutErr:"Cavab vaxtında gəlmədi. İnterneti, VPN/Private DNS-i, API açarını və model adını yoxla (Modelləri yüklə).", scanning:"Oyunun strukturu oxunur...", scanFail:"Oyunun strukturu oxunmadı, kod bu məlumatsız yazılacaq", warnDelete:"⚠ Bu kod oyundan obyekt silir.", accepted:"İstəyiniz qəbul olundu, kod hazırlanır...", keyMismatch:"Bu açar {a} açarına oxşayır, amma {b} seçilib. Ayarlarda {b} seçili olanda onun öz açarını yaz.", permAsk:"Foto və videolara giriş icazəsi lazımdır. İcazə verirsiniz?", permAllow:"İcazə ver", permDeny:"İcazə vermə", permDenied:"Foto/video icazəsi verilmədi.", procMedia:"Foto/video hazırlanır...", mediaDefault:"Əlavə etdiyim foto/videoya uyğun oyunda nəsə et.", coding:"Kod hazırlanır...", stopBtn:"Dayandır", stopped:"Dayandırıldı.", netErr:"İnternet/DNS xətası. Wi‑Fi və ya mobil datanı yoxla, VPN/Private DNS söndür və ya Ayarlarda proxy yaz."
};
const history = [];
let T = {...UI};

const raw0 = () => { try { return JSON.parse(localStorage.getItem("rbxgamecr")||"{}"); } catch { return {}; } };
const cfg = () => {
  const r = raw0(), pv = r.provider||"claude";
  const pp = r.P ? (r.P[pv]||{}) : {aiKey:r.aiKey, model:r.model};
  return {...r, provider:pv, aiKey:(pp.aiKey||"").replace(/\s+/g,""), model:pp.model||""};
};
let P = {}, curProv = "claude";
const GEN = FIELDS.filter(f=>f!=="aiKey"&&f!=="model");
const langName = () => LANGS[cfg().lang||"az"];

/* ---------- şəbəkə ---------- */
async function net(url, opts, proxy, ms=45000){
  const full = (proxy||"") + url;
  let last;
  for(let i=0;i<2;i++){
    try {
      const ctl = new AbortController(); let tm;
      const timer = new Promise((_,rej)=>{ tm=setTimeout(()=>{ ctl.abort(); rej(new Error("TIMEOUT")); }, ms); });
      try { return await Promise.race([fetch(full,{...opts,signal:ctl.signal}), timer]); }
      finally { clearTimeout(tm); }
    }
    catch(e){
      if(e.message==="TIMEOUT") throw new Error(T.timeoutErr);
      last = e;
      await new Promise(r=>setTimeout(r,400));
    }
  }
  const msg = String(last && last.message || last);
  if(/resolve host|Failed to fetch|NetworkError|Load failed|network|timeout/i.test(msg)) throw new Error(T.netErr+"\n("+msg+")");
  throw last;
}

/* ---------- köməkçilər ---------- */
async function jsonOf(r){ const t = await r.text(); try{ return JSON.parse(t); }catch{ return {message:t.slice(0,200)}; } }
const errMsg = (j,r) => (j && ((j.error && (j.error.message || (typeof j.error==="string" ? j.error : ""))) || j.message)) || (j ? JSON.stringify(j).slice(0,200) : "") || ("HTTP "+r.status);
const detectKey = k => /^sk-ant-/.test(k) ? "claude" : /^xai-/.test(k) ? "grok" : /^AIza/.test(k) ? "gemini" : "";
const PN = {claude:"Claude",gemini:"Gemini",grok:"Grok"};
const mismatchMsg = (a,b) => T.keyMismatch.replace(/\{a\}/g,PN[a]).replace(/\{b\}/g,PN[b]);

/* ---------- dil ---------- */
function applyUI(){
  document.querySelectorAll("[data-i]").forEach(el=>{ if(T[el.dataset.i]) el.textContent = T[el.dataset.i]; });
  document.querySelectorAll("[data-ph]").forEach(el=>{ if(T[el.dataset.ph]) el.placeholder = T[el.dataset.ph]; });
  const l = cfg().lang||"az";
  document.documentElement.lang = l;
  document.documentElement.dir = RTL.includes(l) ? "rtl" : "ltr";
}
async function setLang(l){
  if(l==="az"){ T={...UI}; applyUI(); return; }
  const key = "rbxgamecr_ui7_"+l;
  const cached = localStorage.getItem(key);
  if(cached){ T={...UI,...JSON.parse(cached)}; applyUI(); return; }
  T={...UI}; applyUI();
  if((cfg().provider||"claude")==="rbxcrai") return;
  try{
    const raw = await callAI("Translate the JSON values into "+LANGS[l]+". Keep keys, emojis and ‘API’, ‘Roblox’, ‘Universe ID’, ‘Place ID’, ‘URL’ unchanged. Return ONLY valid JSON.",
      [{role:"user",content:JSON.stringify(UI)}],{fast:true,maxTokens:3000});
    const tr = JSON.parse(raw.replace(/```json|```/g,"").trim().replace(/^[^{]*/,"").replace(/[^}]*$/,""));
    localStorage.setItem(key, JSON.stringify(tr));
    T={...UI,...tr}; applyUI();
  }catch(e){ add("⚠ "+e.message,"s er"); }
}

/* ---------- ayarlar ---------- */
function fillLangs(){ $("lang").innerHTML = Object.entries(LANGS).map(([k,v])=>`<option value="${k}">${v}</option>`).join(""); }
function fillProv(){ const pp = P[curProv]||{}; $("aiKey").value = pp.aiKey||""; $("model").value = pp.model||""; $("model").placeholder = DEFAULT_MODEL[curProv]; $("models").innerHTML = ""; }
function loadS(){
  const r = raw0(); GEN.forEach(f=>{ if(r[f]!==undefined) $(f).value=r[f]; }); if(!r.lang) $("lang").value="az";
  curProv = $("provider").value;
  P = r.P ? {...r.P} : ((r.aiKey||r.model) ? {[r.provider||"claude"]:{aiKey:r.aiKey||"",model:r.model||""}} : {});
  fillProv();
}
$("provider").onchange = () => { P[curProv] = {aiKey:$("aiKey").value.trim(), model:$("model").value.trim()}; curProv = $("provider").value; fillProv(); };
function saveS(){
  P[curProv] = {aiKey:$("aiKey").value.trim(), model:$("model").value.trim()};
  const c = {}; GEN.forEach(f=>c[f]=$(f).value.trim()); c.P = P;
  localStorage.setItem("rbxgamecr",JSON.stringify(c));
}

$("openS").onclick = () => { loadS(); $("dlg").showModal(); };
$("closeS").onclick = () => $("dlg").close();
$("saveS").onclick = async () => { saveS(); $("dlg").close(); await setLang(cfg().lang||"az"); add(T.saved,"s ok"); };

const FALLBACK = {
  claude:["claude-sonnet-5-5","claude-haiku-5-5","claude-opus-5-5"],
  gemini:["gemini-2.5-flash","gemini-2.5-pro","gemini-2.0-flash"],
  grok:["grok-4","grok-4-fast","grok-3"],
  rbxcrai:["https://huggingface.co/Qwen/Qwen2.5-Coder-0.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf","https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf"]
};
function showModels(list){ $("models").innerHTML = list.map(m=>`<option value="${m}">`).join(""); }
$("loadM").onclick = async () => {
  saveS(); const c = cfg(), pv = c.provider||"claude"; const st = add("...","s");
  if(pv==="rbxcrai"){ showModels(FALLBACK[pv]); st.textContent = "✅ RBXCoder: API / model lazım deyil"; st.className = "m s ok"; return; }
  showModels(FALLBACK[pv]);
  try{
    if(!c.aiKey) throw new Error("AI API key?");
    const seen = detectKey(c.aiKey);
    if(seen && seen!==pv) throw new Error(mismatchMsg(seen,pv));
    let list = [];
    if(pv==="gemini"){
      let tok = "";
      for(let i=0;i<5;i++){
        const r = await net("https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000"+(tok?"&pageToken="+encodeURIComponent(tok):""),{headers:{"x-goog-api-key":c.aiKey}},c.aiProxy);
        const j = await jsonOf(r); if(!r.ok) throw new Error(errMsg(j,r));
        list.push(...(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name.replace("models/","")));
        tok = j.nextPageToken; if(!tok) break;
      }
      list = list.filter(m=>/^gemini-/.test(m) && !/(tts|image|embedding|live|audio|robotics)/.test(m)).sort().reverse();
    } else {
      const isC = pv==="claude";
      const url = isC ? "https://api.anthropic.com/v1/models?limit=1000" : "https://api.x.ai/v1/models";
      const headers = isC ? {"x-api-key":c.aiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"} : {"authorization":"Bearer "+c.aiKey};
      const r = await net(url,{method:"GET",headers},c.aiProxy);
      const j = await jsonOf(r); if(!r.ok) throw new Error(errMsg(j,r));
      list = (j.data||[]).map(m=>m.id).filter(m=>!/image|video|imagine/.test(m));
    }
    if(!list.length) throw new Error("0 model");
    showModels(list);
    st.textContent = "✅ "+list.length; st.className = "m s ok";
  }catch(e){ st.textContent = "❌ "+e.message; st.className = "m s er"; }
};

function tick(el,label){const t0=Date.now();const id=setInterval(()=>{el.textContent=label+" "+Math.floor((Date.now()-t0)/1000)+"s";},250);return ()=>clearInterval(id);}

function add(text, cls){
  const d = document.createElement("div");
  d.className = "m " + cls; d.textContent = text;
  $("chat").appendChild(d); $("chat").scrollTop = $("chat").scrollHeight;
  return d;
}

/* ---------- AI ---------- */
const FAST_SYSTEM = () => `Sən Roblox oyun yaradıcısısan. İstifadəçinin istəyinə 1-2 cümlə ilə qısa cavab ver: nə edəcəyini de. Kod YAZMA.
Yalnız bu JSON formatında cavab ver, markdown olmasın: {"reply":"qısa cavab","needCode":true,"needScan":false}
needCode: istəyi yerinə yetirmək üçün oyunda dəyişiklik/kod lazımdırsa true, sadə söhbətdirsə false.
needScan: istək oyunda artıq mövcud olan obyektləri silmək, dəyişmək, köçürmək və ya tapmaq tələb edirsə true, yalnız yeni əlavə edirsə false.
"reply" sahəsini bu dildə yaz: ${langName()}.
İstifadəçi foto və ya video kadrları göndərə bilər; onlara baxıb nəzərə al.`;

const CODE_SYSTEM = (tree) => `Sən Roblox Luau mütəxəssisisən. İstifadəçinin istədiyini Roblox Luau skripti ilə et: obyekt əlavə edə, dəyişə və ya silə bilərsən.
Yalnız bu JSON formatında cavab ver, markdown olmasın: {"luau":"icra olunacaq tam Luau kodu"}
Yeni obyektlər Workspace/ServerScriptService/StarterGui kimi xidmətlərdə yaradılmalı, adlandırılmalı və Parent təyin edilməlidir. Yeni obyektlərə aydın və unikal ad ver ki, sonra tapıb silmək asan olsun.
Silmək/dəyişmək üçün: obyekti tapmaq üçün FindFirstChild/GetChildren/GetDescendants istifadə et (tapılmasa xəta atma), silmək üçün :Destroy() çağır. Yalnız istifadəçinin istədiyi obyektlərə toxun. Terrain, Camera və Players-ə toxunma.
Kodun sonunda return ilə nə etdiyini qısa mətn kimi qaytar (məs: "5 obyekt silindi").${tree ? "\nOyunun hazırkı strukturu (eyni adlı obyektlər qruplaşdırılıb, xN sayı bildirir):\n"+tree : ""}
Kodu işlək və səliqəli yaz.
İstifadəçi foto və ya video kadrları göndərə bilər; onlara baxıb nəzərə al.`;

async function callAI(system, msgs, o={}){
  const {ms=45000, fast=false, maxTokens=2000, json=true} = o;
  const c = cfg(), model = c.model || DEFAULT_MODEL[c.provider||"claude"], p = c.aiProxy;
  if(!c.aiKey) throw new Error("AI API key?");
  const seen = detectKey(c.aiKey);
  if(seen && seen !== (c.provider||"claude")) throw new Error(mismatchMsg(seen, c.provider||"claude"));
  if(c.provider==="gemini"){
    const contents = msgs.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content},...(m.images||[]).map(i=>({inlineData:{mimeType:i.mime,data:i.data}}))]}));
    const gen = {};
    if(json) gen.responseMimeType = "application/json";
    if(fast){
      if(/2\.5.*flash/.test(model)) gen.thinkingConfig = {thinkingBudget:0};
      else if(/gemini-3/.test(model)) gen.thinkingConfig = {thinkingLevel:"low"};
      gen.maxOutputTokens = (gen.thinkingConfig && gen.thinkingConfig.thinkingBudget===0) ? maxTokens : Math.max(maxTokens,1500);
    }
    const call = async g => {
      const r = await net(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{
        method:"POST",headers:{"content-type":"application/json","x-goog-api-key":c.aiKey},
        body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents,generationConfig:g})},p,ms);
      return [r, await jsonOf(r)];
    };
    let [r,j] = await call(gen);
    if(!r.ok && gen.thinkingConfig){ delete gen.thinkingConfig; [r,j] = await call(gen); }
    if(!r.ok) throw new Error(errMsg(j,r));
    const cand = j.candidates && j.candidates[0];
    if(!cand || !cand.content) throw new Error((j.promptFeedback && j.promptFeedback.blockReason) || "Boş cavab");
    return cand.content.parts.map(x=>x.text||"").join("");
  }
  if(c.provider==="grok"){
    const r = await net("https://api.x.ai/v1/chat/completions",{method:"POST",headers:{
      "content-type":"application/json","authorization":"Bearer "+c.aiKey},
      body:JSON.stringify({model,messages:[{role:"system",content:system},...msgs.map(m=>m.images&&m.images.length?{role:m.role,content:[{type:"text",text:m.content},...m.images.map(i=>({type:"image_url",image_url:{url:"data:"+i.mime+";base64,"+i.data}}))]}:{role:m.role,content:m.content})]})},p,ms);
    const j = await jsonOf(r); if(!r.ok) throw new Error(errMsg(j,r));
    return j.choices[0].message.content;
  }
  const r = await net("https://api.anthropic.com/v1/messages",{method:"POST",headers:{
    "content-type":"application/json","x-api-key":c.aiKey,"anthropic-version":"2023-06-01",
    "anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model,max_tokens:maxTokens,system,messages:msgs.map(m=>m.images&&m.images.length?{role:m.role,content:[...m.images.map(i=>({type:"image",source:{type:"base64",media_type:i.mime,data:i.data}})),{type:"text",text:m.content}]}:{role:m.role,content:m.content})})},p,ms);
  const j = await jsonOf(r); if(!r.ok) throw new Error(errMsg(j,r));
  return j.content.map(x=>x.text||"").join("");
}

const strip = t => t.replace(/```json|```lua|```luau|```/g,"").trim();
function parseFast(raw){
  const clean = strip(raw), s = clean.indexOf("{"), e = clean.lastIndexOf("}");
  try { const j = JSON.parse(clean.slice(s,e+1)); return {reply:j.reply||"", need:j.needCode!==false, scan:j.needScan===true}; }
  catch { return {reply:clean, need:true, scan:false}; }
}
function parseCode(raw){

// limit yoxdur: iş bitənə və ya istifadəçi "Dayandır" basana qədər gözləyir
async function runInGame(code, ctl, save=true){
  const c = cfg();
  if(!c.rbxKey||!c.uid||!c.pid) throw new Error("Roblox API key / Universe ID / Place ID?");
  const base = `/cloud/v2/universes/${c.uid}/places/${c.pid}/luau-execution-session-tasks`;
  const full = (c.autoSave==="off"||!save) ? code : "local __ok, __res = pcall(function()\n" + code + "\nend)\nif not __ok then error(__res, 0) end\ngame:GetService(\"AssetService\"):SavePlaceAsync()\nreturn __res";
  const task = await rbx(base,{method:"POST",body:JSON.stringify({script:full})});
  let fails = 0;
  for(let i=0; !ctl.stop; i++){
    await sleep(i<5?500:1000);
    let t;
    try { t = await rbx("/cloud/v2/"+task.path); fails = 0; }
    catch(e){ if(++fails>=5) throw e; continue; }
    if(t.state==="COMPLETE") return t.output?.results?.join("\n")||"OK";
    if(t.state==="FAILED"||t.state==="CANCELLED") throw new Error(t.error?.message||t.state);
  }
  throw new Error(T.stopped);
}

const SCAN_LUAU = `local services = {"Workspace","ServerScriptService","ServerStorage","ReplicatedStorage","StarterGui","StarterPack","Lighting"}
local lines, MAXL, MAXD = {}, 400, 4
local function walk(inst, depth)
  if #lines >= MAXL or depth > MAXD then return end
  local groups, order = {}, {}
  for _, ch in ipairs(inst:GetChildren()) do
    if ch.ClassName ~= "Terrain" and ch.ClassName ~= "Camera" then
      local k = ch.Name .. "|" .. ch.ClassName
      if not groups[k] then groups[k] = {n = 0, first = ch}; table.insert(order, k) end
      groups[k].n += 1
    end
  end
  for _, k in ipairs(order) do
    if #lines >= MAXL then lines[#lines + 1] = "..."; return end
    local g = groups[k]
    lines[#lines + 1] = string.rep("  ", depth) .. g.first.Name .. " [" .. g.first.ClassName .. "]" .. (g.n > 1 and (" x" .. g.n) or "")
    if g.n == 1 then walk(g.first, depth + 1) end
  end
end
for _, name in ipairs(services) do
  local ok, svc = pcall(function() return game:GetService(name) end)
  if ok and svc then lines[#lines + 1] = name; walk(svc, 1) end
end
return table.concat(lines, string.char(10))`;

const loadImg = src => new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("image")); i.src=src; });
function shrink(src, w, h, max, q){
  const k = Math.min(1, max/Math.max(w,h)), c = document.createElement("canvas");
  c.width = Math.max(1,Math.round(w*k)); c.height = Math.max(1,Math.round(h*k));
  c.getContext("2d").drawImage(src,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",q);
}
async function processImage(f){
  const url = URL.createObjectURL(f);
  try{
    const im = await loadImg(url), w = im.naturalWidth, h = im.naturalHeight;
    return {thumb:shrink(im,w,h,160,0.6), images:[{mime:"image/jpeg",data:shrink(im,w,h,1280,0.8).split(",")[1]}]};
  } finally { URL.revokeObjectURL(url); }
}
// video: bərabər məsafədə 4 kadr çıxarılır (bütün AI provayderlərində işləsin deyə)
async function processVideo(f){
  const url = URL.createObjectURL(f);
  const v = document.createElement("video"); v.muted = true; v.preload = "auto"; v.playsInline = true; v.src = url;
  try{
    await Promise.race([new Promise((res,rej)=>{ v.onloadedmetadata = res; v.onerror = () => rej(new Error("video")); }), sleep(15000).then(()=>{ throw new Error("video"); })]);
    const dur = v.duration || 1, n = 4, imgs = []; let thumb = "";
    for(let k=0;k<n;k++){
      v.currentTime = Math.max(0, Math.min(dur-0.05, dur*(k+0.5)/n));
      await Promise.race([new Promise(res=>{ v.onseeked = res; }), sleep(8000)]);
      imgs.push({mime:"image/jpeg",data:shrink(v,v.videoWidth,v.videoHeight,768,0.7).split(",")[1]});
      if(!k) thumb = shrink(v,v.videoWidth,v.videoHeight,160,0.6);
    }
    return {thumb, images:imgs};
  } finally { URL.revokeObjectURL(url); }
}

function codeBalanced(code){
  const c = code.replace(/--\[\[[\s\S]*?\]\]/g,"").replace(/--.*$/gm,"").replace(/\[\[[\s\S]*?\]\]/g,'""').replace(/"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'/g,'""');
  let open = 0;
  for(const t of (c.match(/\b(function|if|for|while|repeat|until|end)\b/g)||[])){
    if(t==="end"||t==="until") open--; else open++;
  }
  return open===0;
}
function cleanLuau(raw){
  const m = raw.match(/```(?:lua|luau)?\s*([\s\S]*?)(```|$)/i);
  let code = (m ? m[1] : raw).trim();
  let lines = code.split("\n");
  while(lines.length && !codeBalanced(lines.join("\n"))) lines.pop();   // kəsilmiş (yarımçıq) sətirləri at
  code = lines.join("\n").trim();
  if(!code) throw new Error("boş / yarımçıq kod");
  const last = code.split("\n").filter(x=>x.trim()).pop().trim();
  if(!/^return\b/.test(last)) code += '\n\nreturn "OK"';
  return "-- RBXCoder (beta) tərəfindən yaradıldı\n" + code;
}

async function llmGenerate(text, tree, progress, ctl){
  const w = await ensureLLM(progress);
  const user = text + (tree ? "\n\nCurrent game tree:\n" + tree : "");
  const msgs = [{role:"system",content:CODER_SYS}, ...FEWSHOT, {role:"user",content:user}];
  const t0 = Date.now(); let n = 0, partial = "";
  const ac = new AbortController(); ctl.abort = () => ac.abort();
  const iv = setInterval(()=>progress(rmsg("writing")+" "+fmtT((Date.now()-t0)/1000)+" / "+fmtT(RBX_MAX)+" · "+n+" token"), 500);
  try{
    const out = await w.createChatCompletion(msgs, {
      nPredict: 800, sampling:{temp:0.2, top_k:40, top_p:0.9}, abortSignal: ac.signal,
      onNewToken:(tok,piece,cur)=>{ n++; if(typeof cur==="string") partial = cur; if(Date.now()-t0 > RBX_MAX*1000 || ctl.stopped) ac.abort(); }
    });
    if(typeof out==="string" && out) partial = out;
  }catch(e){ if(!partial) throw e; }
  finally{ clearInterval(iv); }
  return cleanLuau(partial);
}

      const tree = DEL_RX.test(text) ? (await scanGame()).slice(0,1500) : "";
      const code = await llmGenerate(text, tree, m=>{ span.textContent = m; }, ctl);
      out = {reply: rmsg("llmReply"), luau: code};
    }catch(e){
      out = {reply: rmsg("llmFail")+"\n⚠ "+e.message, luau: ""};
    }finally{ st.remove(); }
  }
  const box = add(out.reply + (images.length ? rmsg("noimg") : ""),"a");
  if(out.luau){ const pre = document.createElement("pre"); pre.textContent = out.luau; box.appendChild(pre); askBring(out.luau); }
  $("chat").scrollTop = $("chat").scrollHeight;
}

function rbxcrai(text){
  const t = text.toLowerCase();
  let color = null;
  for(const [rx,c] of RCOLORS){ if(rx.test(t)){ color = c; break; } }
  const col = color || [80,160,255];
  const cl = `Color3.fromRGB(${col[0]}, ${col[1]}, ${col[2]})`;
  const q = (text.match(/["«“„]([^"»”“]+)["»”]/)||[])[1];
  const nm = t.match(/\d+(?:[.,]\d+)?/), N = nm ? parseFloat(nm[0].replace(",",".")) : null;
  const cnt = (def,max) => Math.max(1, Math.min(Math.round(N||def), max));
  const HEAD = `-- RBXCoder tərəfindən yaradıldı
local Workspace = game:GetService("Workspace")

`;
  const res = (k, v, code) => ({reply: rmsg(k,v), luau: code});

  // 1) silmə
  if(/(^|\s)(sil(?!ah)|silin|delete|remove|destroy|kaldır|yok et|удал|убер|təmizlə|temizle|clear)/.test(t)){
    const nameM = t.match(/(?:adlı|adli|named|adındakı|adındaki)\s+([^\s"«»]+)/);
    const target = (q || (nameM ? nameM[1] : "")).toLowerCase();
    return res("del",{},`-- RBXCoder: silmə ("rbx_" ilə başlayan və ya adı uyğun gələn obyektlər)
local Workspace = game:GetService("Workspace")

local TARGET = ${target ? JSON.stringify(target) : "nil"}
local COLOR = ${color ? cl : "nil"}
local PROTECTED = { Terrain = true, Camera = true, Baseplate = true }

local toDelete = {}
for _, obj in ipairs(Workspace:GetDescendants()) do
    if not PROTECTED[obj.Name] and not obj:IsA("Terrain") and not obj:IsA("Camera") then
        local matches
        if TARGET then
            matches = string.lower(obj.Name) == TARGET
        else
            matches = string.sub(obj.Name, 1, 4) == "rbx_"
        end
        if matches and COLOR and obj:IsA("BasePart") then
            matches = (obj.Color == COLOR)
        end
        if matches then
            table.insert(toDelete, obj)
        end
    end
end

for _, obj in ipairs(toDelete) do
    obj:Destroy()
end

return "OK (" .. #toDelete .. ")"`);
  }

  // 2) ekrana yazı
  if(q && /yaz|text|metin|надпис|ekran|screen|label|başlıq|sözü/.test(t)){
    return res("gui",{},`-- RBXCoder: ekrana yazı
local StarterGui = game:GetService("StarterGui")

local gui = Instance.new("ScreenGui")
gui.Name = "rbx_Message"
gui.ResetOnSpawn = false

local label = Instance.new("TextLabel")
label.Size = UDim2.new(0.6, 0, 0.12, 0)
label.Position = UDim2.new(0.2, 0, 0.05, 0)
label.BackgroundColor3 = Color3.fromRGB(20, 20, 20)
label.BackgroundTransparency = 0.3
label.TextColor3 = Color3.fromRGB(255, 255, 255)
label.TextScaled = true
label.Font = Enum.Font.GothamBold
label.Text = ${JSON.stringify(q)}
label.Parent = gui

gui.Parent = StarterGui
return "OK"`);
  }

  // 3) gecə / gündüz
  if(/gecə|gece|night|ноч/.test(t)) return res("night",{},`local Lighting = game:GetService("Lighting")
Lighting.ClockTime = 0
Lighting.Brightness = 1
return "OK"`);
  if(/gündüz|gunduz|\bday\b|день|днём|днем/.test(t)) return res("day",{},`local Lighting = game:GetService("Lighting")
Lighting.ClockTime = 14
Lighting.Brightness = 2
return "OK"`);

  // 4) cazibə
  if(/cazibə|cazibe|gravity|yerçekimi|гравитац/.test(t)){
    return res("gravity",{},`local Workspace = game:GetService("Workspace")
Workspace.Gravity = ${N !== null ? N : 196.2}
return "OK (" .. Workspace.Gravity .. ")"`);
  }

  // 5) pilləkən / divar / qüllə
  if(/pillə|pille|stair|merdiven|лестниц/.test(t)){
    const n = cnt(10,100);
    return res("stairs",{n},`${HEAD}${LUA_HELP}local STEPS = ${n}
local COLOR = ${cl}

for i = 1, STEPS do
    -- hər pillə yerdən başlayır, ona görə pilləkən möhkəm görünür
    makePart("rbx_Stair_" .. i, Vector3.new(10, i, 3), Vector3.new(0, i / 2, 25 + i * 3), COLOR)
end

return "OK (" .. STEPS .. ")"`);
  }
  if(/divar|wall|duvar|стен/.test(t)){
    const n = cnt(10,40);
    return res("wall",{},`${HEAD}${LUA_HELP}local COLUMNS = ${n}
local ROWS = 5
local COLOR = ${cl}

for row = 1, ROWS do
    for column = 1, COLUMNS do
        local x = (column - (COLUMNS + 1) / 2) * 4
        local y = (row - 0.5) * 2
        makePart("rbx_Wall_" .. row .. "_" .. column, Vector3.new(4, 2, 1), Vector3.new(x, y, 25), COLOR)
    end
end

return "OK (" .. ROWS * COLUMNS .. ")"`);
  }
  if(/qüllə|qulle|tower|kule|башн/.test(t)){
    const n = cnt(10,60);
    return res("tower",{},`${HEAD}${LUA_HELP}local HEIGHT = ${n}
local COLOR = ${cl}

for i = 1, HEIGHT do
    makePart("rbx_Tower_" .. i, Vector3.new(6, 3, 6), Vector3.new(0, (i - 0.5) * 3, 25), COLOR)
end

return "OK (" .. HEIGHT .. ")"`);
  }

  // 6) xüsusi platformalar
  if(/lava|ölüm|olum|öldür|kill|лав|смерт/.test(t)){
    return res("lava",{},`${HEAD}${LUA_HELP}local part = makePart("rbx_Lava", Vector3.new(12, 1, 12), Vector3.new(0, 0.5, 40), Color3.fromRGB(255, 60, 0))
part.Material = Enum.Material.Neon

local ok = addScript(part, [[
    local part = script.Parent
    part.Touched:Connect(function(hit)
        local humanoid = hit.Parent and hit.Parent:FindFirstChildOfClass("Humanoid")
        if humanoid then
            humanoid.Health = 0
        end
    end)
]])

return "OK (script: " .. tostring(ok) .. ")"`);
  }
  if(/sürət|surət|speed|hız|скорост/.test(t)){
    return res("speed",{},`${HEAD}${LUA_HELP}local part = makePart("rbx_SpeedPad", Vector3.new(10, 1, 10), Vector3.new(0, 0.5, 40), Color3.fromRGB(0, 255, 120))
part.Material = Enum.Material.Neon

local ok = addScript(part, [[
    local part = script.Parent
    part.Touched:Connect(function(hit)
        local humanoid = hit.Parent and hit.Parent:FindFirstChildOfClass("Humanoid")
        if humanoid then
            humanoid.WalkSpeed = 50
            task.delay(5, function()
                humanoid.WalkSpeed = 16
            end)
        end
    end)
]])

return "OK (script: " .. tostring(ok) .. ")"`);
  }
  if(/tullan|jump|zıpl|прыж/.test(t)){
    return res("jump",{},`${HEAD}${LUA_HELP}local part = makePart("rbx_JumpPad", Vector3.new(10, 1, 10), Vector3.new(0, 0.5, 40), Color3.fromRGB(255, 220, 0))
part.Material = Enum.Material.Neon

local ok = addScript(part, [[
    local part = script.Parent
    part.Touched:Connect(function(hit)
        local humanoid = hit.Parent and hit.Parent:FindFirstChildOfClass("Humanoid")
        if humanoid then
            humanoid.UseJumpPower = true
            humanoid.JumpPower = 100
            task.delay(5, function()
                humanoid.JumpPower = 50
            end)
        end
    end)
]])

return "OK (script: " .. tostring(ok) .. ")"`);
  }
  if(/spawn|doğulma|dogulma|doğma|спавн|появлен/.test(t)){
    return res("spawn",{},`local Workspace = game:GetService("Workspace")

local spawnPoint = Instance.new("SpawnLocation")
spawnPoint.Name = "rbx_Spawn"
spawnPoint.Size = Vector3.new(8, 1, 8)
spawnPoint.Position = Vector3.new(0, 0.5, 0)
spawnPoint.Anchored = true
spawnPoint.Neutral = true
spawnPoint.Parent = Workspace

return "OK"`);
  }
  if(/fırlan|firlan|spin|dön|вращ/.test(t)){
    return res("spin",{},`${HEAD}${LUA_HELP}local part = makePart("rbx_Spinner", Vector3.new(12, 2, 2), Vector3.new(0, 6, 30), ${cl})

local ok = addScript(part, [[
    local part = script.Parent
    while true do
        part.CFrame = part.CFrame * CFrame.Angles(0, math.rad(2), 0)
        task.wait()
    end
]])

return "OK (script: " .. tostring(ok) .. ")"`);
  }

  // 7) blok / top / silindr əlavə et
  const shapeBall = /(^|\s)(top|topu|toplar|küre|ball|sphere|шар)/.test(t);
  const shapeCyl = /silindr|silindir|cylinder|цилиндр/.test(t);
  const addWord = /əlavə|elave|add|ekle|создай|добав|qur|yarat|create|make|yap|et(\s|$)/.test(t);
  const blockWord = /blok|block|part|куб|блок/.test(t);
  if(blockWord || shapeBall || shapeCyl || (addWord && (color || N !== null))){
    const n = cnt(1,200);
    const shape = shapeBall ? "Ball" : shapeCyl ? "Cylinder" : "Block";
    return res("add",{n},`${HEAD}${LUA_HELP}local COUNT = ${n}
local COLOR = ${cl}
local SIZE = Vector3.new(4, 4, 4)
local columns = math.ceil(math.sqrt(COUNT))

for i = 1, COUNT do
    local column = (i - 1) % columns
    local row = math.floor((i - 1) / columns)
    local position = Vector3.new((column - columns / 2) * 6, SIZE.Y / 2, 25 + row * 6)
    makePart("rbx_Block_" .. i, SIZE, position, COLOR, Enum.PartType.${shape})
end

return "OK (" .. COUNT .. ")"`);
  }

  return {reply: rmsg("unknown"), luau: ""};
}

/* ---------- chat ---------- */
const hist = withCode => history.slice(-6).map(m=>({role:m.role,content:(withCode&&m.code)?m.content+"\n```lua\n"+m.code+"\n```":m.content}));

async function send(){
  const typed = $("inp").value.trim(); if(!typed && !atts.length) return;
  const text = typed || T.mediaDefault;
  const images = atts.flatMap(a=>a.images);
  $("inp").value = ""; const ub = add(text,"u");
  atts.forEach(a=>{ const im = document.createElement("img"); im.src = a.thumb; im.style.cssText = "display:block;max-width:140px;border-radius:8px;margin-top:6px"; ub.appendChild(im); });
  atts.length = 0; renderPrev();
  const userMsg = {role:"user",content:text,images};

  // RBXCoder: API-siz (cihazda işləyən model + hazır şablonlar)
  if((cfg().provider||"claude")==="rbxcrai"){ await rbxCoderFlow(text, images); return; }

  // 1-ci mərhələ: istifadəçiyə 45 saniyə ərzində qısa cavab (xəta göstərilmir)
  const st = add(T.connecting,"s"), stop = tick(st,T.connecting);
  let reply = "", need = true, scan = false;
  try{
    const raw = await callAI(FAST_SYSTEM(), hist(false).concat([userMsg]), {ms:45000, fast:true, maxTokens:300});
    const p = parseFast(raw); reply = p.reply; need = p.need; scan = p.scan;
  }catch(e){ reply = T.accepted; }
  stop(); st.remove();
  const box = add(reply||T.accepted,"a");
  if(!need){ history.push({role:"user",content:text},{role:"assistant",content:reply,code:""}); $("chat").scrollTop = $("chat").scrollHeight; return; }

  // 2-ci mərhələ: lazım olsa oyunu oxu, sonra kodu yaz (5 dəqiqəyə qədər)
  const tree = (scan || DEL_RX.test(text)) ? await scanGame() : "";
  const st2 = add(T.coding,"s"), stop2 = tick(st2,T.coding);
  try{
    const raw2 = await callAI(CODE_SYSTEM(tree), hist(true).concat([userMsg]), {ms:300000, maxTokens:4000});
    stop2(); st2.remove();
    const luau = parseCode(raw2);
    const pre = document.createElement("pre"); pre.textContent = luau; box.appendChild(pre);
    history.push({role:"user",content:text},{role:"assistant",content:reply,code:luau});
    askBring(luau);
  }catch(e){ stop2(); st2.textContent="❌ "+e.message; st2.className="m s er"; }
  $("chat").scrollTop = $("chat").scrollHeight;
}
$("send").onclick = send;
$("inp").addEventListener("keydown",e=>{ if(e.key==="Enter") send(); });

fillLangs(); loadS(); setLang(cfg().lang||"az");
