<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rbxgamecr</title>
<style>
  :root{--bg:#0f1115;--card:#181b22;--tx:#e8eaf0;--mu:#8b92a5;--ac:#4f8cff;--ok:#2ecc71;--er:#ff5c5c}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);height:100dvh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid #262a34}
  header h1{font-size:18px;margin:0}
  button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:15px;cursor:pointer}
  button.sec{background:#2a2f3b}
  #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .m{max-width:88%;padding:10px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word;line-height:1.4}
  .u{align-self:flex-end;background:var(--ac)}
  .a{align-self:flex-start;background:var(--card)}
  .s{align-self:center;color:var(--mu);font-size:13px}
  .s.ok{color:var(--ok)} .s.er{color:var(--er)}
  pre{background:#0b0d11;padding:8px;border-radius:8px;overflow-x:auto;font-size:12px}
  #bar{display:flex;gap:8px;padding:10px;background:var(--card);border-top:1px solid #262a34}
  #inp{flex:1;background:#0f1115;color:var(--tx);border:1px solid #2a2f3b;border-radius:8px;padding:10px;font-size:16px}
  dialog{background:var(--card);color:var(--tx);border:1px solid #2a2f3b;border-radius:14px;width:min(94vw,440px);padding:18px}
  dialog::backdrop{background:#000a}
  label{display:block;margin:10px 0 4px;font-size:13px;color:var(--mu)}
  dialog input,dialog select{width:100%;background:#0f1115;color:var(--tx);border:1px solid #2a2f3b;border-radius:8px;padding:10px;font-size:15px}
  .row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
  .note{font-size:12px;color:var(--mu);margin-top:10px}
</style>
</head>
<body>
<header>
  <h1>🎮 rbxgamecr</h1>
  <button class="sec" id="openS">⚙ Ayarlar</button>
</header>

<div id="chat">
  <div class="m s">Ayarlardan AI və Roblox API-ni yaz, sonra oyunda nə istədiyini yaz.</div>
</div>

<div id="bar">
  <input id="inp" placeholder="Məs: mapa 10 ədəd qırmızı blok əlavə et" autocomplete="off">
  <button id="send">Göndər</button>
</div>

<dialog id="dlg">
  <h3 style="margin:0 0 6px">Ayarlar</h3>

  <label>AI seçimi</label>
  <select id="provider">
    <option value="claude">Claude</option>
    <option value="gemini">Gemini</option>
    <option value="grok">Grok</option>
  </select>

  <label>AI API açarı</label>
  <input id="aiKey" type="password" placeholder="AI API key">

  <label>Model (boş qalsa standart)</label>
  <input id="model" placeholder="claude-sonnet-5-5 / gemini-2.5-flash / grok-4">

  <label>Roblox game API açarı (Open Cloud)</label>
  <input id="rbxKey" type="password" placeholder="Roblox Open Cloud API key">

  <label>Universe ID</label>
  <input id="uid" inputmode="numeric">

  <label>Place ID</label>
  <input id="pid" inputmode="numeric">

  <label>Proxy URL (istəyə bağlı, CORS üçün)</label>
  <input id="proxy" placeholder="https://mening-proxy.workers.dev/?u=">

  <div class="note">Açarlar yalnız bu cihazın brauzerində saxlanılır. Roblox API açarında Luau Execution icazəsi olmalıdır.</div>
  <div class="row">
    <button class="sec" id="closeS">Bağla</button>
    <button id="saveS">Yadda saxla</button>
  </div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const FIELDS = ["provider","aiKey","model","rbxKey","uid","pid","proxy"];
const DEFAULT_MODEL = {claude:"claude-sonnet-5-5", gemini:"gemini-2.5-flash", grok:"grok-4"};
const history = [];

const cfg = () => { try { return JSON.parse(localStorage.getItem("rbxgamecr")||"{}"); } catch { return {}; } };
function loadS(){ const c=cfg(); FIELDS.forEach(f=>{ if(c[f]!==undefined) $(f).value=c[f]; }); }
function saveS(){ const c={}; FIELDS.forEach(f=>c[f]=$(f).value.trim()); localStorage.setItem("rbxgamecr",JSON.stringify(c)); }

$("openS").onclick = () => { loadS(); $("dlg").showModal(); };
$("closeS").onclick = () => $("dlg").close();
$("saveS").onclick = () => { saveS(); $("dlg").close(); add("Ayarlar yadda saxlandı.","s ok"); };

function add(text, cls){
  const d = document.createElement("div");
  d.className = "m " + cls; d.textContent = text;
  $("chat").appendChild(d); $("chat").scrollTop = $("chat").scrollHeight;
  return d;
}

const SYSTEM = `Sən Roblox oyun yaradıcısısan. İstifadəçi oyunda nə istəyirsə, onu Roblox Luau skripti ilə et.
Yalnız bu JSON formatında cavab ver, başqa heç nə yazma, markdown olmasın:
{"reply":"istifadəçiyə qısa izah (onun dilində)","luau":"icra olunacaq tam Luau kodu"}
Luau kodu Workspace/ServerScriptService/StarterGui kimi xidmətlərdə obyektlər yaratmalı, adlandırmalı və Parent təyin etməlidir.
Əgər oyunda dəyişiklik lazım deyilsə, luau sahəsini boş string qoy.`;

async function askAI(text){
  const c = cfg(), model = c.model || DEFAULT_MODEL[c.provider];
  if(!c.aiKey) throw new Error("AI API açarı yoxdur (Ayarlar).");
  const msgs = history.concat([{role:"user",content:text}]);

  if(c.provider==="claude"){
    const r = await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{
      "content-type":"application/json","x-api-key":c.aiKey,"anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model,max_tokens:4000,system:SYSTEM,messages:msgs})});
    const j = await r.json(); if(!r.ok) throw new Error(j.error?.message||r.status);
    return j.content.map(p=>p.text||"").join("");
  }
  if(c.provider==="gemini"){
    const contents = msgs.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]}));
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{
      method:"POST",headers:{"content-type":"application/json","x-goog-api-key":c.aiKey},
      body:JSON.stringify({systemInstruction:{parts:[{text:SYSTEM}]},contents})});
    const j = await r.json(); if(!r.ok) throw new Error(j.error?.message||r.status);
    return j.candidates[0].content.parts.map(p=>p.text||"").join("");
  }
  // grok (xAI, OpenAI uyğun)
  const r = await fetch("https://api.x.ai/v1/chat/completions",{method:"POST",headers:{
    "content-type":"application/json","authorization":"Bearer "+c.aiKey},
    body:JSON.stringify({model,messages:[{role:"system",content:SYSTEM},...msgs]})});
  const j = await r.json(); if(!r.ok) throw new Error(j.error?.message||r.status);
  return j.choices[0].message.content;
}

function parseAI(raw){
  const clean = raw.replace(/```json|```/g,"").trim();
  const s = clean.indexOf("{"), e = clean.lastIndexOf("}");
  try { return JSON.parse(clean.slice(s,e+1)); } catch { return {reply:raw, luau:""}; }
}

async function rbx(path, opts={}){
  const c = cfg();
  const url = (c.proxy||"") + "https://apis.roblox.com" + path;
  const r = await fetch(url,{...opts,headers:{"x-api-key":c.rbxKey,"content-type":"application/json"}});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.message||j.error||("Roblox API "+r.status));
  return j;
}

async function runInGame(code){
  const c = cfg();
  if(!c.rbxKey||!c.uid||!c.pid) throw new Error("Roblox API açarı / Universe ID / Place ID yoxdur (Ayarlar).");
  const base = `/cloud/v2/universes/${c.uid}/places/${c.pid}/luau-execution-session-tasks`;
  const task = await rbx(base,{method:"POST",body:JSON.stringify({script:code})});
  for(let i=0;i<40;i++){
    await new Promise(r=>setTimeout(r,1500));
    const t = await rbx("/cloud/v2/"+task.path);
    if(t.state==="COMPLETE") return t.output?.results?.join("\n")||"OK";
    if(t.state==="FAILED"||t.state==="CANCELLED") throw new Error(t.error?.message||t.state);
  }
  throw new Error("Vaxt bitdi.");
}

async function send(){
  const text = $("inp").value.trim(); if(!text) return;
  $("inp").value = ""; add(text,"u");
  const st = add("API qoşulur...","s");
  try{
    const raw = await askAI(text);
    history.push({role:"user",content:text},{role:"assistant",content:raw});
    const {reply,luau} = parseAI(raw);
    st.remove(); add(reply||"…","a");
    if(luau){
      const pre = document.createElement("pre"); pre.textContent = luau;
      $("chat").lastChild.appendChild(pre);
      const st2 = add("Roblox oyununa əlavə olunur...","s");
      try{ const out = await runInGame(luau); st2.textContent="✅ Oyuna əlavə olundu. "+out; st2.className="m s ok"; }
      catch(e){ st2.textContent="❌ Roblox: "+e.message; st2.className="m s er"; }
    }
  }catch(e){ st.textContent="❌ "+e.message; st.className="m s er"; }
  $("chat").scrollTop = $("chat").scrollHeight;
}
$("send").onclick = send;
$("inp").addEventListener("keydown",e=>{ if(e.key==="Enter") send(); });
</script>
</body>
</html>
